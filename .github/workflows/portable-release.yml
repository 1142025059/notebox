name: portable-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Assemble portable package
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'notebox-portable'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'scripts') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'data') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'web\dist') -Force | Out-Null

          Copy-Item (Get-Command node).Source (Join-Path $root 'node.exe')
          Copy-Item 'server' (Join-Path $root 'server') -Recurse
          Copy-Item 'web\dist\*' (Join-Path $root 'web\dist') -Recurse
          Copy-Item 'scripts\launcher.mjs' (Join-Path $root 'scripts\launcher.mjs')
          Copy-Item 'scripts\activate-window.ps1' (Join-Path $root 'scripts\activate-window.ps1')
          Copy-Item 'notebox.vbs' (Join-Path $root 'notebox.vbs')
          Copy-Item 'README-PORTABLE.txt' (Join-Path $root 'README.txt')

          $pkg = '{"name":"notebox","version":"0.1.0","private":true,"type":"module","dependencies":{"@fastify/static":"^10.1.11","fastify":"^5.12.8"}}'
          Set-Content -Path (Join-Path $root 'package.json') -Value $pkg -Encoding utf8

          Push-Location $root
          npm install --omit=dev --no-audit --no-fund
          Pop-Location

          Compress-Archive -Path $root -DestinationPath 'notebox-portable.zip' -Force
          Get-Item 'notebox-portable.zip' | Select-Object Name, Length

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag notebox-portable.zip --title "notebox $tag" --notes "Windows portable build: unzip and double-click notebox.vbs"
          }
          else {
            gh release upload $tag notebox-portable.zip --clobber
          }
